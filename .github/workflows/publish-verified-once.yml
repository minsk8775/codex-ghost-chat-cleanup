name: Publish verified v1.1.1 once
on:
  push:
    branches: [release/verified-v1.1.1-20261028]
permissions:
  contents: read
jobs:
  release:
    if: github.repository == 'minsk8775/codex-ghost-chat-cleanup' && github.ref == 'refs/heads/release/verified-v1.1.1-20261028'
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: b81cc505c21219ff6103fe3accd06ddc433c1935
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Recheck offline tests and package
        shell: pwsh
        run: |
          if ((Get-Content VERSION -Raw).Trim() -ne '1.1.1') { throw 'Version mismatch' }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          ./scripts/package_release.ps1 -Version 'v1.1.1' -OutputDirectory 'dist'
      - name: Publish exact tested commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = 'minsk8775/codex-ghost-chat-cleanup'
          $sha = 'b81cc505c21219ff6103fe3accd06ddc433c1935'
          $tag = 'v1.1.1'
          $main = gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha'
          if ($LASTEXITCODE -ne 0 -or $main -ne $sha) { throw 'Main changed or cannot be verified' }
          $existingTag = gh api "repos/$repo/tags" --paginate --jq '.[] | select(.name == "v1.1.1") | .commit.sha'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect tags' }
          if ($existingTag -and $existingTag -ne $sha) { throw 'Tag points to another commit' }
          $existingRelease = gh api "repos/$repo/releases" --paginate --jq '.[] | select(.tag_name == "v1.1.1") | .html_url'
          if ($LASTEXITCODE -ne 0 -or $existingRelease) { throw 'Release already exists or cannot be verified; inspect before retrying' }
          if (-not $existingTag) {
            gh api "repos/$repo/git/refs" -f "ref=refs/tags/$tag" -f "sha=$sha" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw 'Tag creation failed; inspect before retrying' }
          }
          $verifiedTag = gh api "repos/$repo/commits/$tag" --jq '.sha'
          if ($LASTEXITCODE -ne 0 -or $verifiedTag -ne $sha) { throw 'Tag verification failed before publication' }
          @'
          Deletion that commits before a failed post-check now returns exit code 2 with an explicit committed receipt, backup path and no-retry signal. Schema checks cover consumed columns, identifier affinities, the thread primary key, metadata and unexpected triggers, including revalidation under the write lock.

          Recovery and user backups are never automatically deleted. CI actions are pinned to verified SHAs. Validation: all 13 synthetic SQLite tests and release packaging passed. No live Codex database was opened or changed.

          Verify SHA256SUMS.txt before installation. This is an unofficial community tool; unknown schemas stop safely and compatibility with every desktop release is not claimed.
          '@ | Set-Content -LiteralPath release-notes.txt -Encoding utf8
          gh release create $tag dist/*.zip dist/SHA256SUMS.txt --repo $repo --verify-tag --title $tag --notes-file release-notes.txt
          if ($LASTEXITCODE -ne 0) { throw 'Publication failed; inspect release state before retrying' }
          $published = gh api "repos/$repo/commits/$tag" --jq '.sha'
          if ($LASTEXITCODE -ne 0 -or $published -ne $sha) { throw 'Published tag verification failed' }
